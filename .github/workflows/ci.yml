name: OrderFlow CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # JOB 1: BUILD AND TEST
  # ============================================================
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:

      # --------------------------------------------------------
      # PostgreSQL
      # --------------------------------------------------------
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: orderflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin

        ports:
          - 5433:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d orderflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5


      # --------------------------------------------------------
      # Kafka
      # --------------------------------------------------------
      kafka:
        image: apache/kafka:4.1.2

        ports:
          - 9092:9092

        env:
          KAFKA_NODE_ID: 1

          KAFKA_PROCESS_ROLES: broker,controller

          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1


    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Java 21
      # --------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # --------------------------------------------------------
      # Wait until Kafka is accepting connections
      # --------------------------------------------------------
      - name: Wait for Kafka
        run: |
          echo "Waiting for Kafka on localhost:9092..."

          for i in {1..30}; do

            if nc -z localhost 9092; then
              echo "Kafka port is available"
              exit 0
            fi

            echo "Kafka not ready yet..."
            sleep 2

          done

          echo "Kafka did not start"
          exit 1


      # --------------------------------------------------------
      # Create Kafka topics
      # --------------------------------------------------------
      - name: Create Kafka topics
        run: |

          docker exec ${{ job.services.kafka.id }} \
            /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic order-events \
            --partitions 3 \
            --replication-factor 1


          docker exec ${{ job.services.kafka.id }} \
            /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic order-events.DLT \
            --partitions 3 \
            --replication-factor 1


          echo "========== order-events =========="

          docker exec ${{ job.services.kafka.id }} \
            /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --describe \
            --topic order-events


          echo "========== order-events.DLT =========="

          docker exec ${{ job.services.kafka.id }} \
            /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --describe \
            --topic order-events.DLT


      # --------------------------------------------------------
      # Run complete Maven test suite
      # --------------------------------------------------------
      - name: Build and test
        run: |
          ./mvnw clean test \
            -DforkCount=1 \
            -DreuseForks=true



  # ============================================================
  # JOB 2: BUILD DOCKER IMAGE AND PUSH TO ACR
  # ============================================================
  build-and-push:
    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    # Docker image is built only if tests pass.
    needs:
      - test

    # Do not push Docker images for pull requests.
    # Only pushes to main publish an image.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'


    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Verify GitHub can actually see the ACR secrets
      #
      # IMPORTANT:
      # This does NOT print either secret.
      # --------------------------------------------------------
      - name: Verify ACR secrets
        shell: bash

        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

        run: |

          if [ -z "$ACR_USERNAME" ]; then
            echo "ACR_USERNAME is missing"
            exit 1
          fi


          if [ -z "$ACR_PASSWORD" ]; then
            echo "ACR_PASSWORD is missing"
            exit 1
          fi


          echo "Both ACR secrets are available"


      # --------------------------------------------------------
      # Login to Azure Container Registry
      # --------------------------------------------------------
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3

        with:
          registry: orderflowrajesh2026.azurecr.io

          username: ${{ secrets.ACR_USERNAME }}

          password: ${{ secrets.ACR_PASSWORD }}


      # --------------------------------------------------------
      # Build AMD64 Docker image and push to ACR
      #
      # Two tags are created:
      #
      # orderflow:<Git commit SHA>
      # orderflow:latest
      #
      # AKS uses linux/amd64, so we explicitly build AMD64.
      # --------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6

        with:
          context: .

          push: true

          platforms: linux/amd64

          tags: |
            orderflowrajesh2026.azurecr.io/orderflow:${{ github.sha }}
            orderflowrajesh2026.azurecr.io/orderflow:latest