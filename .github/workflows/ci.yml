name: OrderFlow CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # 1. BUILD AND TEST
  # ============================================================
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: orderflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d orderflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      kafka:
        image: apache/kafka:4.1.2
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Wait for Kafka
        shell: bash
        run: |
          echo "Waiting for Kafka..."

          for i in {1..30}; do
            if docker exec ${{ job.services.kafka.id }} \
              /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 \
              --list >/dev/null 2>&1; then

              echo "Kafka is ready"
              exit 0
            fi

            echo "Kafka not ready yet..."
            sleep 2
          done

          echo "Kafka failed to become ready"
          exit 1

      - name: Create Kafka topics
        shell: bash
        run: |
          docker exec ${{ job.services.kafka.id }} \
            /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic order-events \
            --partitions 3 \
            --replication-factor 1

          docker exec ${{ job.services.kafka.id }} \
            /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create \
            --if-not-exists \
            --topic order-events.DLT \
            --partitions 3 \
            --replication-factor 1

      - name: Verify Kafka topics
        run: |
          docker exec ${{ job.services.kafka.id }} \
            /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --list

      - name: Build and test
        env:
          DB_URL: jdbc:postgresql://localhost:5433/orderflow
          DB_USERNAME: postgres
          DB_PASSWORD: admin
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          ./mvnw clean test \
            -DforkCount=1 \
            -DreuseForks=true


  # ============================================================
  # 2. BUILD DOCKER IMAGE AND PUSH TO ACR
  # ============================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify ACR secrets
        shell: bash
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -z "$ACR_USERNAME" ]; then
            echo "ACR_USERNAME is missing"
            exit 1
          fi

          if [ -z "$ACR_PASSWORD" ]; then
            echo "ACR_PASSWORD is missing"
            exit 1
          fi

          echo "Both ACR secrets are available"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: orderflowrajesh2026.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            orderflowrajesh2026.azurecr.io/orderflow:${{ github.sha }}
            orderflowrajesh2026.azurecr.io/orderflow:latest


  # ============================================================
  # 3. DEPLOY TO AZURE KUBERNETES SERVICE
  # ============================================================
  deploy-to-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest

    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify AKS kubeconfig secret
        shell: bash
        env:
          AKS_KUBECONFIG: ${{ secrets.AKS_KUBECONFIG }}
        run: |
          if [ -z "$AKS_KUBECONFIG" ]; then
            echo "AKS_KUBECONFIG is missing"
            exit 1
          fi

          echo "AKS_KUBECONFIG is available"

      - name: Configure kubectl
        shell: bash
        env:
          AKS_KUBECONFIG: ${{ secrets.AKS_KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$AKS_KUBECONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Verify AKS connection
        run: |
          echo "Current Kubernetes context:"
          kubectl config current-context

          echo "AKS nodes:"
          kubectl get nodes

      - name: Deploy new image to AKS
        run: |
          kubectl set image deployment/orderflow \
            orderflow=orderflowrajesh2026.azurecr.io/orderflow:${{ github.sha }}

      - name: Wait for AKS rollout
        run: |
          kubectl rollout status deployment/orderflow \
            --timeout=180s

      - name: Verify deployment
        run: |
          echo "OrderFlow pods:"
          kubectl get pods -l app=orderflow

          echo ""
          echo "Deployed image:"
          kubectl get deployment orderflow \
            -o=jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""
      - name: Verify deployment
        run: |
          echo "OrderFlow pods:"
          kubectl get pods -l app=orderflow

          echo ""
          echo "Deployed image:"
          kubectl get deployment orderflow \
            -o=jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""

      - name: Smoke test live API
        shell: bash
        run: |
          ORDERFLOW_IP=$(kubectl get service orderflow-service \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          echo "Testing OrderFlow at $ORDERFLOW_IP"

          for i in {1..10}; do
            if curl --fail --silent --show-error \
              "http://$ORDERFLOW_IP/products/1"; then
              echo ""
              echo "Smoke test passed"
              exit 0
            fi

            echo "Application not ready yet. Retrying..."
            sleep 10
          done

          echo "Smoke test failed"
          exit 1
      - name: Roll back deployment on failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."
          kubectl rollout undo deployment/orderflow
          kubectl rollout status deployment/orderflow --timeout=180s