apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: orderflow

  template:
    metadata:
      labels:
        app: orderflow

    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: orderflow
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40

      imagePullSecrets:
        - name: acr-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: orderflow
          image: orderflowrajesh2026.azurecr.io/orderflow:latest
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 8080

          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: DB_URL

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: orderflow-app-db-secret
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderflow-app-db-secret
                  key: password

            - name: FLYWAY_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: DB_URL

            - name: FLYWAY_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: orderflow-migrator-db-secret
                  key: username

            - name: FLYWAY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderflow-migrator-db-secret
                  key: password

            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: orderflow-config
                  key: KAFKA_BOOTSTRAP_SERVERS

            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: orderflow-admin-secret
                  key: ADMIN_USERNAME

            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderflow-admin-secret
                  key: ADMIN_PASSWORD

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "1000m"
              memory: "512Mi"

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi